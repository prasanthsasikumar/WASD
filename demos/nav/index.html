<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigation HUD: WASD demo</title>
<meta name="robots" content="noindex">
<style>
  /* Built for an additive waveguide: the background is pure #000 so it
     emits nothing and renders fully transparent on the glasses. Only the
     bright marks are drawn. Nothing here is thinner than 2px. */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: 'Helvetica Neue', Inter, system-ui, -apple-system, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 34px 40px;
    -webkit-font-smoothing: antialiased;
  }
  .eyebrow {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #9fd8ff;
  }
  .distance {
    font-size: 88px;
    font-weight: 700;
    letter-spacing: -2px;
    line-height: 1;
    margin-top: 16px;
  }
  .distance span { font-size: 40px; font-weight: 600; margin-left: 6px; }
  .street {
    font-size: 26px;
    line-height: 1.25;
    margin-top: 14px;
    color: rgba(255,255,255,0.88);
  }
  .arrow { margin-top: 18px; }
  .foot { margin-top: auto; display: flex; flex-direction: column; gap: 14px; }
  .bar { height: 6px; background: rgba(255,255,255,0.22); border-radius: 3px; }
  .bar > i { display: block; width: 62%; height: 100%; background: #9fd8ff; border-radius: 3px; }
  .meta {
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    color: rgba(255,255,255,0.75);
  }
  .meta strong { color: #fff; font-weight: 600; }
</style>
</head>
<body>
  <div class="eyebrow">Navigation</div>
  <div class="distance">240<span>m</span></div>
  <div class="street">Turn right on<br>Cuba Street</div>

  <svg class="arrow" width="64" height="64" viewBox="0 0 48 48" fill="none" aria-hidden="true">
    <path d="M10 38 V22 a6 6 0 0 1 6-6 h18" stroke="#9fd8ff" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M27 9 l9 7 -9 7" stroke="#9fd8ff" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="foot">
    <div class="bar"><i></i></div>
    <div class="meta"><span>ETA <strong>4 min</strong></span><span><strong>12:41</strong></span></div>
  </div>
</body>
</html>
