<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Timer: WASD demo</title>
<meta name="robots" content="noindex">
<style>
  /* Same additive rules as the navigation demo: #000 ground, bright marks
     only, nothing thinner than 2px. Pair it with the Cooking scene. */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: 'Helvetica Neue', Inter, system-ui, -apple-system, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    -webkit-font-smoothing: antialiased;
  }
  .label {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ffd479;
  }
  .ring { position: relative; width: 290px; height: 290px; }
  .ring svg { transform: rotate(-90deg); display: block; }
  .time {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 74px;
    font-weight: 700;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
  }
  .step { font-size: 26px; color: rgba(255,255,255,0.85); text-align: center; }
  .step b { color: #ffd479; font-weight: 600; }
</style>
</head>
<body>
  <div class="label">Simmer</div>

  <div class="ring">
    <svg width="290" height="290" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="7"/>
      <!-- 68% of the circumference (2*pi*52 = 326.7) -->
      <circle cx="60" cy="60" r="52" fill="none" stroke="#ffd479" stroke-width="7"
              stroke-linecap="round" stroke-dasharray="222 327"/>
    </svg>
    <div class="time" id="t">6:47</div>
  </div>

  <div class="step">Step 3 of 5 <b>&middot;</b> Reduce heat</div>

<script>
  // Counts down so the panel is visibly live inside the simulator.
  let left = 6 * 60 + 47;
  const el = document.getElementById('t');
  setInterval(() => {
    if (left <= 0) return;
    left -= 1;
    el.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  }, 1000);
</script>
</body>
</html>
